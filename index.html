<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>

<body>

<script type="module">

/* ==================================================
   IMPORTS
================================================== */

import * as THREE from 'three';

import {
  GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';

import {
  OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
  EffectComposer
} from 'three/addons/postprocessing/EffectComposer.js';

import {
  RenderPass
} from 'three/addons/postprocessing/RenderPass.js';

import {
  UnrealBloomPass
} from 'three/addons/postprocessing/UnrealBloomPass.js';

import {
  ShaderPass
} from 'three/addons/postprocessing/ShaderPass.js';


/* ==================================================
   SCENE
================================================== */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x000000);


/* ==================================================
   CAMERA
================================================== */

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.001,
    10000
  );


/* ==================================================
   RENDERER
================================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;


/* ==================================================
   TONE MAPPING
================================================== */

renderer.toneMapping =
  THREE.ReinhardToneMapping;

renderer.toneMappingExposure =
  1.10;

document.body.appendChild(
  renderer.domElement
);


/* ==================================================
   CONTROLS
================================================== */

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping =
  true;

controls.dampingFactor =
  0.05;

controls.enableRotate =
  true;

controls.rotateSpeed =
  0.7;

controls.enableZoom =
  true;

controls.zoomSpeed =
  0.5;

controls.enablePan =
  true;

controls.panSpeed =
  0.8;

controls.mouseButtons.LEFT =
  THREE.MOUSE.ROTATE;

controls.mouseButtons.MIDDLE =
  THREE.MOUSE.PAN;

controls.mouseButtons.RIGHT =
  THREE.MOUSE.PAN;

controls.minAzimuthAngle =
  -Infinity;

controls.maxAzimuthAngle =
  Infinity;

controls.minPolarAngle =
  0.15;

controls.maxPolarAngle =
  Math.PI - 0.15;


/* ==================================================
   POST PROCESSING
================================================== */

const composer =
  new EffectComposer(
    renderer
  );

composer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

composer.setSize(
  window.innerWidth,
  window.innerHeight
);


/* ==================================================
   RENDER PASS
================================================== */

const renderPass =
  new RenderPass(
    scene,
    camera
  );

composer.addPass(
  renderPass
);


/* ==================================================
   BLOOM
================================================== */

const bloomPass =
  new UnrealBloomPass(

    new THREE.Vector2(
      window.innerWidth,
      window.innerHeight
    ),

    0.25,   // strength
    0.35,   // radius
    0.50    // threshold

  );

composer.addPass(
  bloomPass
);


/* ==================================================
   FINAL POST PROCESSING
================================================== */

const finalShader = {

  uniforms: {

    tDiffuse: {
      value: null
    },

    resolution: {

      value:
        new THREE.Vector2(
          window.innerWidth,
          window.innerHeight
        )

    },

    vignetteAmount: {
      value: 0.30
    },

    vignetteHardness: {
      value: 0.45
    },

    sharpness: {
      value: 0.20
    }

  },


  vertexShader: `

    varying vec2 vUv;

    void main() {

      vUv = uv;

      gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(
          position,
          1.0
        );

    }

  `,


  fragmentShader: `

    uniform sampler2D tDiffuse;

    uniform vec2 resolution;

    uniform float vignetteAmount;

    uniform float vignetteHardness;

    uniform float sharpness;

    varying vec2 vUv;


    void main() {

      vec2 texel =
        1.0 / resolution;


      vec3 center =
        texture2D(
          tDiffuse,
          vUv
        ).rgb;


      vec3 north =
        texture2D(
          tDiffuse,
          vUv + vec2(
            0.0,
            texel.y
          )
        ).rgb;


      vec3 south =
        texture2D(
          tDiffuse,
          vUv - vec2(
            0.0,
            texel.y
          )
        ).rgb;


      vec3 east =
        texture2D(
          tDiffuse,
          vUv + vec2(
            texel.x,
            0.0
          )
        ).rgb;


      vec3 west =
        texture2D(
          tDiffuse,
          vUv - vec2(
            texel.x,
            0.0
          )
        ).rgb;


      vec3 blur =
        (
          north +
          south +
          east +
          west
        ) * 0.25;


      vec3 color =
        center +
        (
          center -
          blur
        ) * sharpness;


      vec2 p =
        vUv - 0.5;


      float distanceFromCenter =
        length(
          p *
          vec2(
            1.0,
            0.85
          )
        );


      float edge =
        smoothstep(

          0.25 +
          vignetteHardness * 0.15,

          0.78,

          distanceFromCenter

        );


      color *=
        1.0 -
        edge *
        vignetteAmount *
        0.55;


      gl_FragColor =
        vec4(
          color,
          1.0
        );

    }

  `

};


const finalPass =
  new ShaderPass(
    finalShader
  );

composer.addPass(
  finalPass
);


/* ==================================================
   TEXTURE LOADER
================================================== */

const textureLoader =
  new THREE.TextureLoader();


/* ==================================================
   LOAD GALAXY TEXTURE ONCE

   Used by:
   1. visible outside background
   2. PBR environment
   3. inside-facing sphere material
================================================== */

let galaxyTexture =
  null;

let galaxyEnvTexture =
  null;

let galaxySphere =
  null;

let loadedModel =
  null;


/* ==================================================
   CREATE INSIDE SPHERE MATERIAL
================================================== */

function createInsideGalaxyMaterial(
  texture
) {

  return new THREE.ShaderMaterial({

    /*
      Only render the INNER face
      of the enclosing sphere.
    */

    side:
      THREE.BackSide,

    depthTest:
      true,

    depthWrite:
      true,

    transparent:
      false,

    /*
      Let the result participate in
      Reinhard tone mapping.
    */

    toneMapped:
      true,


    uniforms: {

      galaxyTexture: {
        value:
          texture
      },


      /*
        Main amount of galaxy visible
        on the sphere interior.

        Recommended starting point = 0.70
      */

      galaxyStrength: {
        value:
          0.70
      },


      /*
        Controls how dark / black
        the sphere still feels.

        Higher = darker.
      */

      darkness: {
        value:
          0.38
      },


      /*
        Additional reflected galaxy layer.
      */

      reflectionStrength: {
        value:
          0.35
      },


      /*
        Slight midtone lift inside sphere.
      */

      galaxyGamma: {
        value:
          0.88
      },


      /*
        Match Sketchfab environment
        orientation.
      */

      rotationY: {
        value:
          THREE.MathUtils.degToRad(
            133.333
          )
      }

    },


    vertexShader: `

      varying vec3 vWorldPosition;
      varying vec3 vWorldNormal;


      void main() {

        vec4 worldPosition =
          modelMatrix *
          vec4(
            position,
            1.0
          );


        vWorldPosition =
          worldPosition.xyz;


        vWorldNormal =
          normalize(
            mat3(
              modelMatrix
            ) *
            normal
          );


        gl_Position =
          projectionMatrix *
          viewMatrix *
          worldPosition;

      }

    `,


    fragmentShader: `

      #define PI 3.1415926535897932384626433832795


      uniform sampler2D galaxyTexture;

      uniform float galaxyStrength;

      uniform float darkness;

      uniform float reflectionStrength;

      uniform float galaxyGamma;

      uniform float rotationY;


      varying vec3 vWorldPosition;

      varying vec3 vWorldNormal;


      /* ------------------------------------------
         Rotate direction around Y axis
      ------------------------------------------ */

      vec3 rotateAroundY(
        vec3 direction,
        float angle
      ) {

        float c =
          cos(
            angle
          );

        float s =
          sin(
            angle
          );


        return vec3(

          c * direction.x +
          s * direction.z,

          direction.y,

          -s * direction.x +
          c * direction.z

        );

      }


      /* ------------------------------------------
         Direction -> Equirectangular UV
      ------------------------------------------ */

      vec2 directionToUV(
        vec3 direction
      ) {

        direction =
          normalize(
            direction
          );


        float longitude =
          atan(
            direction.z,
            direction.x
          );


        float latitude =
          asin(
            clamp(
              direction.y,
              -1.0,
              1.0
            )
          );


        vec2 uv;


        uv.x =
          longitude /
          (
            2.0 * PI
          ) +
          0.5;


        uv.y =
          latitude /
          PI +
          0.5;


        return uv;

      }


      void main() {


        /*
          Original geometry normal
          points OUTWARD.

          Camera is inside sphere,
          so flip it to get inward-facing
          shading direction.
        */

        vec3 outwardNormal =
          normalize(
            vWorldNormal
          );


        vec3 inwardNormal =
          -outwardNormal;


        /*
          Direction from fragment
          toward camera.
        */

        vec3 viewDir =
          normalize(
            cameraPosition -
            vWorldPosition
          );


        /* ==========================================
           DIRECT GALAXY LAYER

           Use the sphere direction itself to
           project the panoramic galaxy onto
           the interior wall.
        ========================================== */

        vec3 galaxyDirection =
          rotateAroundY(

            outwardNormal,

            rotationY

          );


        vec2 galaxyUV =
          directionToUV(
            galaxyDirection
          );


        vec3 directGalaxy =
          texture2D(

            galaxyTexture,

            galaxyUV

          ).rgb;


        /*
          Lift nebula / Milky Way midtones.
        */

        directGalaxy =
          pow(

            directGalaxy,

            vec3(
              galaxyGamma
            )

          );


        /* ==========================================
           REFLECTED GALAXY LAYER

           Gives some of the "environment reflection"
           quality back to the surface.
        ========================================== */

        vec3 incident =
          -viewDir;


        vec3 reflectedDirection =
          reflect(

            incident,

            inwardNormal

          );


        reflectedDirection =
          rotateAroundY(

            reflectedDirection,

            rotationY

          );


        vec2 reflectedUV =
          directionToUV(
            reflectedDirection
          );


        vec3 reflectedGalaxy =
          texture2D(

            galaxyTexture,

            reflectedUV

          ).rgb;


        reflectedGalaxy =
          pow(

            reflectedGalaxy,

            vec3(
              0.92
            )

          );


        /* ==========================================
           FRESNEL

           Adds more environment character
           toward grazing angles / sphere edges.
        ========================================== */

        float fresnel =
          1.0 -
          abs(

            dot(

              inwardNormal,

              viewDir

            )

          );


        fresnel =
          pow(
            fresnel,
            2.0
          );


        /* ==========================================
           DARK BASE

           Prevents the sphere from looking like
           a simple JPG pasted onto geometry.
        ========================================== */

        vec3 darkBase =
          vec3(
            0.003,
            0.004,
            0.008
          );


        /*
          Darkness 0.38 means:
          retain a substantial black base,
          but allow galaxy detail through.
        */

        float galaxyMix =
          galaxyStrength *
          (
            1.0 -
            darkness * 0.45
          );


        vec3 color =
          mix(

            darkBase,

            directGalaxy,

            galaxyMix

          );


        /*
          Add reflected environment layer.
        */

        color +=

          reflectedGalaxy *

          reflectionStrength *

          (
            0.35 +
            fresnel * 0.65
          );


        /*
          Slightly preserve stronger blue /
          gold highlights without turning
          everything into neon.
        */

        color *=
          0.92;


        gl_FragColor =
          vec4(
            color,
            1.0
          );

      }

    `

  });

}


/* ==================================================
   APPLY MODEL MATERIALS

   Automatically detects largest mesh.
================================================== */

function applyModelMaterials(
  model,
  insideTexture
) {

  model.updateMatrixWorld(
    true
  );


  let largestMesh =
    null;

  let largestVolume =
    -Infinity;


  model.traverse(

    function(child) {


      if (
        !child.isMesh
      ) {

        return;

      }


      const meshBox =

        new THREE.Box3()
          .setFromObject(
            child
          );


      const meshSize =

        meshBox.getSize(
          new THREE.Vector3()
        );


      const volume =

        meshSize.x *
        meshSize.y *
        meshSize.z;


      console.log(
        'MESH:',
        child.name,
        'SIZE:',
        meshSize.x,
        meshSize.y,
        meshSize.z,
        'VOLUME:',
        volume
      );


      if (
        volume >
        largestVolume
      ) {

        largestVolume =
          volume;

        largestMesh =
          child;

      }

    }

  );


  if (
    largestMesh
  ) {

    console.log(
      'ENCLOSING SPHERE DETECTED:',
      largestMesh.name
    );

  }


  model.traverse(

    function(child) {


      if (
        !child.isMesh
      ) {

        return;

      }


      /* ==================================================
         LARGE ENCLOSING SPHERE

         Replace the original PBR material
         with our inside-facing hybrid material.
      ================================================== */

      if (
        child === largestMesh
      ) {


        const insideMaterial =
          createInsideGalaxyMaterial(
            insideTexture
          );


        /*
          Replace all materials on this mesh.

          This avoids changing shared GLTF
          materials used by smaller meshes.
        */

        if (
          Array.isArray(
            child.material
          )
        ) {

          child.material =
            child.material.map(
              () =>
                insideMaterial.clone()
            );

        }

        else {

          child.material =
            insideMaterial;

        }


        console.log(
          'Applied INSIDE GALAXY material:',
          child.name
        );


        return;

      }


      /* ==================================================
         ALL OTHER OBJECTS

         Keep current PBR settings.
      ================================================== */

      const materials =

        Array.isArray(
          child.material
        )

        ? child.material

        : [child.material];


      materials.forEach(

        function(material) {


          material.side =
            THREE.DoubleSide;


          if (
            'metalness'
            in material
          ) {

            material.metalness =
              0.67;

          }


          if (
            'roughness'
            in material
          ) {

            material.roughness =
              0.10;

          }


          if (
            'envMapIntensity'
            in material
          ) {

            material.envMapIntensity =
              0.5;

          }


          if (
            'transmission'
            in material
          ) {

            material.transmission =
              0;

          }


          if (
            material.isMeshPhysicalMaterial
          ) {

            material.clearcoat =
              0.80;


            material.clearcoatRoughness =
              0.08;


            if (
              'specularIntensity'
              in material
            ) {

              material.specularIntensity =
                1.0;

            }


            material.transmission =
              0;

          }


          if (
            'emissive'
            in material
          ) {

            material.emissive.set(
              0x000000
            );


            material.emissiveIntensity =
              0;

          }


          material.needsUpdate =
            true;

        }

      );

    }

  );

}


/* ==================================================
   GALAXY BACKGROUND
================================================== */

textureLoader.load(

  './Space_4.jpg',

  function(texture) {


    galaxyTexture =
      texture;


    galaxyTexture.colorSpace =
      THREE.SRGBColorSpace;


    galaxyTexture.wrapS =
      THREE.RepeatWrapping;


    galaxyTexture.wrapT =
      THREE.ClampToEdgeWrapping;


    /* ==================================================
       VISIBLE OUTSIDE GALAXY
    ================================================== */

    const galaxyGeometry =
      new THREE.SphereGeometry(
        500,
        64,
        32
      );


    const galaxyMaterial =
      new THREE.ShaderMaterial({

        side:
          THREE.BackSide,

        depthWrite:
          false,

        depthTest:
          false,

        toneMapped:
          false,


        uniforms: {

          galaxyTexture: {
            value:
              galaxyTexture
          },

          brightness: {
            value:
              1.6
          }

        },


        vertexShader: `

          varying vec2 vUv;


          void main() {

            vUv = uv;

            gl_Position =
              projectionMatrix *
              modelViewMatrix *
              vec4(
                position,
                1.0
              );

          }

        `,


        fragmentShader: `

          uniform sampler2D galaxyTexture;

          uniform float brightness;

          varying vec2 vUv;


          void main() {

            vec3 color =
              texture2D(
                galaxyTexture,
                vUv
              ).rgb;


            color *=
              brightness;


            color =
              pow(
                color,
                vec3(0.90)
              );


            color =
              clamp(
                color,
                0.0,
                1.0
              );


            gl_FragColor =
              vec4(
                color,
                1.0
              );

          }

        `

      });


    galaxySphere =
      new THREE.Mesh(
        galaxyGeometry,
        galaxyMaterial
      );


    galaxySphere.renderOrder =
      -1000;


    scene.add(
      galaxySphere
    );


    /* ==================================================
       ENVIRONMENT MAP
    ================================================== */

    const pmremGenerator =
      new THREE.PMREMGenerator(
        renderer
      );


    pmremGenerator
      .compileEquirectangularShader();


    texture.mapping =
      THREE.EquirectangularReflectionMapping;


    const envMap =

      pmremGenerator

        .fromEquirectangular(
          texture
        )

        .texture;


    galaxyEnvTexture =
      envMap;


    scene.environment =
      envMap;


    /*
      Keep your current value.
    */

    scene.environmentIntensity =
      4.5;


    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(
        133.333
      );


    /*
      If model already loaded before texture,
      apply materials now.
    */

    if (
      loadedModel
    ) {

      applyModelMaterials(
        loadedModel,
        galaxyTexture
      );

    }


    console.log(
      'Galaxy + environment loaded'
    );

  },


  undefined,


  function(error) {

    console.error(
      'Galaxy loading error:',
      error
    );

  }

);


/* ==================================================
   MODEL
================================================== */

const loader =
  new GLTFLoader();


let mixer =
  null;


loader.load(

  './xuanzhuan.glb',


  function(gltf) {


    const model =
      gltf.scene;


    loadedModel =
      model;


    scene.add(
      model
    );


    /*
      Apply hybrid material once
      galaxy texture is available.
    */

    if (
      galaxyTexture
    ) {

      applyModelMaterials(
        model,
        galaxyTexture
      );

    }


    /* ==================================================
       MODEL BOUNDS
    ================================================== */

    const box =

      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =

      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =

      Math.max(
        size.x,
        size.y,
        size.z
      );


    /* ==================================================
       CAMERA POSITION
    ================================================== */

    camera.position.set(

      17.783538553077037,

      -15.83921320951988,

      9.356759277746589

    );


    /* ==================================================
       CAMERA TARGET
    ================================================== */

    controls.target.set(

      -7.760279812375713,

      -0.7600947078594433,

      6.601639691238137

    );


    /* ==================================================
       FOV
    ================================================== */

    camera.fov =
      45;


    camera.near =

      Math.max(
        maxDim * 0.0001,
        0.0001
      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ==================================================
       ANIMATION
    ================================================== */

    if (
      gltf.animations.length > 0
    ) {


      mixer =

        new THREE.AnimationMixer(
          model
        );


      const action =

        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(
        THREE.LoopRepeat,
        Infinity
      );


      /*
        IMPORTANT:
        KEEP ANIMATION AT 0.1×
      */

      action.timeScale =
        0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

  },


  function(xhr) {


    if (
      xhr.total
    ) {


      console.log(

        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)

        + '% loaded'

      );

    }

  },


  function(error) {


    console.error(
      'GLB loading error:',
      error
    );

  }

);


/* ==================================================
   CAMERA DEBUG — PRESS P
================================================== */

const cameraInfo =
  document.createElement(
    'div'
  );


cameraInfo.style.position =
  'fixed';

cameraInfo.style.top =
  '20px';

cameraInfo.style.left =
  '20px';

cameraInfo.style.zIndex =
  '9999';

cameraInfo.style.padding =
  '12px 16px';

cameraInfo.style.background =
  'rgba(0,0,0,0.82)';

cameraInfo.style.color =
  'white';

cameraInfo.style.fontFamily =
  'monospace';

cameraInfo.style.fontSize =
  '13px';

cameraInfo.style.lineHeight =
  '1.6';

cameraInfo.style.borderRadius =
  '6px';

cameraInfo.style.display =
  'none';

cameraInfo.style.pointerEvents =
  'none';


document.body.appendChild(
  cameraInfo
);


window.addEventListener(

  'keydown',

  function(event) {


    if (
      event.key.toLowerCase()
      === 'p'
    ) {


      const text =
`CAMERA POSITION:
${camera.position.x},
${camera.position.y},
${camera.position.z}

CAMERA TARGET:
${controls.target.x},
${controls.target.y},
${controls.target.z}

CAMERA FOV:
${camera.fov}`;


      cameraInfo.innerText =
        text;


      cameraInfo.style.display =
        'block';


      console.log(
        text
      );


      navigator.clipboard

        .writeText(
          text
        )

        .catch(
          () => {}
        );

    }

  }

);


/* ==================================================
   ANIMATION LOOP
================================================== */

const clock =
  new THREE.Clock();


function animate() {


  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if (
    mixer
  ) {

    mixer.update(
      delta
    );

  }


  /*
    Keep external galaxy sphere
    centered around camera.
  */

  if (
    galaxySphere
  ) {

    galaxySphere.position.copy(
      camera.position
    );

  }


  controls.update();


  composer.render();

}


animate();


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

  'resize',

  function() {


    const width =
      window.innerWidth;


    const height =
      window.innerHeight;


    camera.aspect =
      width /
      height;


    camera.updateProjectionMatrix();


    renderer.setSize(
      width,
      height
    );


    composer.setSize(
      width,
      height
    );


    finalPass
      .uniforms
      .resolution
      .value
      .set(
        width,
        height
      );

  }

);


</script>

</body>
