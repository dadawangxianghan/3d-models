<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

  </style>


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>


<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


/* ==================================================
   SCENE
================================================== */

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(
    0x000000
  );


/* ==================================================
   CAMERA
================================================== */

const camera =
  new THREE.PerspectiveCamera(

    45,

    window.innerWidth /
    window.innerHeight,

    0.001,

    10000

  );


/* ==================================================
   RENDERER
================================================== */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    alpha: false

  });


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


/*
  Lower exposure because
  Environment Intensity = 5.

  This prevents the spheres
  from becoming too bright.
*/

renderer.toneMappingExposure =
  0.9;


document.body.appendChild(
  renderer.domElement
);


/* ==================================================
   CONTROLS
================================================== */

const controls =
  new OrbitControls(

    camera,

    renderer.domElement

  );


controls.enableDamping =
  true;


controls.dampingFactor =
  0.05;


controls.enableRotate =
  true;


controls.rotateSpeed =
  0.7;


controls.enableZoom =
  true;


controls.zoomSpeed =
  0.5;


controls.enablePan =
  true;


controls.panSpeed =
  0.8;


/* LEFT = ROTATE */

controls.mouseButtons.LEFT =
  THREE.MOUSE.ROTATE;


/* MIDDLE = PAN */

controls.mouseButtons.MIDDLE =
  THREE.MOUSE.PAN;


/* RIGHT = PAN */

controls.mouseButtons.RIGHT =
  THREE.MOUSE.PAN;


controls.minAzimuthAngle =
  -Infinity;


controls.maxAzimuthAngle =
  Infinity;


controls.minPolarAngle =
  0.15;


controls.maxPolarAngle =
  Math.PI - 0.15;


/* ==================================================
   TEXTURE LOADER
================================================== */

const textureLoader =
  new THREE.TextureLoader();


/* ==================================================
   GALAXY BACKGROUND

   Background brightness is separate
   from model environment lighting.
================================================== */

let galaxySphere =
  null;


textureLoader.load(

  './Space_4.jpg',

  function(texture) {


    texture.colorSpace =
      THREE.SRGBColorSpace;


    const galaxyGeometry =
      new THREE.SphereGeometry(

        500,

        64,

        32

      );


    const galaxyMaterial =
      new THREE.ShaderMaterial({


        side:
          THREE.BackSide,


        depthWrite:
          false,


        depthTest:
          false,


        toneMapped:
          false,


        uniforms: {


          galaxyTexture: {

            value: texture

          },


          /*
            Visible galaxy brightness.

            Independent from
            environmentIntensity.
          */

          brightness: {

            value: 1.05

          }

        },


        vertexShader: `

          varying vec2 vUv;

          void main() {

            vUv = uv;

            gl_Position =

              projectionMatrix *

              modelViewMatrix *

              vec4(
                position,
                1.0
              );

          }

        `,


        fragmentShader: `

          uniform sampler2D galaxyTexture;

          uniform float brightness;

          varying vec2 vUv;


          void main() {

            vec3 color =

              texture2D(
                galaxyTexture,
                vUv
              ).rgb;


            color *=
              brightness;


            gl_FragColor =

              vec4(
                color,
                1.0
              );

          }

        `

      });


    galaxySphere =
      new THREE.Mesh(

        galaxyGeometry,

        galaxyMaterial

      );


    galaxySphere.rotation.y =
      THREE.MathUtils.degToRad(
        0
      );


    galaxySphere.renderOrder =
      -1000;


    scene.add(
      galaxySphere
    );


    console.log(
      'Galaxy background loaded'
    );

  },

  undefined,

  function(error) {

    console.error(
      'Galaxy loading error:',
      error
    );

  }

);


/* ==================================================
   PBR ENVIRONMENT
================================================== */

const pmremGenerator =
  new THREE.PMREMGenerator(
    renderer
  );


pmremGenerator
  .compileEquirectangularShader();


textureLoader.load(

  './Space_4.jpg',

  function(texture) {


    texture.mapping =
      THREE.EquirectangularReflectionMapping;


    texture.colorSpace =
      THREE.SRGBColorSpace;


    const envMap =

      pmremGenerator

        .fromEquirectangular(
          texture
        )

        .texture;


    scene.environment =
      envMap;


    /* ==============================================
       SKETCHFAB-LIKE ENVIRONMENT STRENGTH

       Requested:
       5
    ============================================== */

    scene.environmentIntensity =
      5;


    /*
      Sketchfab environment orientation:
      133.333°
    */

    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(
        133.333
      );


    console.log(
      'PBR environment loaded'
    );

  },

  undefined,

  function(error) {

    console.error(
      'Environment loading error:',
      error
    );

  }

);


/* ==================================================
   LIGHTS

   NONE.

   No AmbientLight.
   No HemisphereLight.
   No DirectionalLight.
   No RectAreaLight.

   Scene lighting comes only
   from the PBR environment.
================================================== */


/* ==================================================
   MODEL
================================================== */

const loader =
  new GLTFLoader();


let mixer =
  null;


loader.load(

  './xuanzhuan.glb',

  function(gltf) {


    const model =
      gltf.scene;


    scene.add(
      model
    );


    /* ==============================================
       MATERIAL SETTINGS
    ============================================== */

    model.traverse(

      function(child) {


        if (
          !child.isMesh
        ) {

          return;

        }


        const materials =

          Array.isArray(
            child.material
          )

          ? child.material

          : [child.material];


        materials.forEach(

          function(material) {


            /* ======================================
               DOUBLE SIDED
            ====================================== */

            material.side =
              THREE.DoubleSide;


            /* ======================================
               ROUGHNESS

               Sketchfab = 0
            ====================================== */

            if (
              'roughness'
              in material
            ) {

              material.roughness =
                0;

            }


            /* ======================================
               GLASS / TRANSMISSION

               Sketchfab = 0
            ====================================== */

            if (
              'transmission'
              in material
            ) {

              material.transmission =
                0;

            }


            /* ======================================
               REFLECTIVITY

               Sketchfab clear coat
               reflectivity = 0
            ====================================== */

            if (
              'reflectivity'
              in material
            ) {

              material.reflectivity =
                0;

            }


            /* ======================================
               ENVIRONMENT REFLECTION

               Scene intensity is 5,
               so material intensity is
               intentionally lower.

               This prevents the spheres
               becoming over-bright.
            ====================================== */

            if (
              'envMapIntensity'
              in material
            ) {

              material.envMapIntensity =
                0.45;

            }


            /* ======================================
               CLEAR COAT

               Sketchfab:
               Clear Coat = ON
               Intensity = 1
               Surface roughness = 0
            ====================================== */

            if (
              material.isMeshPhysicalMaterial
            ) {

              material.clearcoat =
                1;


              material.clearcoatRoughness =
                0;


              material.transmission =
                0;


              material.reflectivity =
                0;

            }


            material.needsUpdate =
              true;

          }

        );

      }

    );


    /* ==============================================
       MODEL SIZE
    ============================================== */

    const box =

      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =

      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =

      Math.max(

        size.x,

        size.y,

        size.z

      );


    /* ==============================================
       NEW CAMERA POSITION
    ============================================== */

    camera.position.set(

      4.583646459952426,

      -5.288950308574907,

      15.909453303006309

    );


    /* ==============================================
       NEW CAMERA TARGET
    ============================================== */

    controls.target.set(

      -7.534758927241818,

      -0.9440802729326992,

      -1.1863348083699172

    );


    /* ==============================================
       FOV
    ============================================== */

    camera.fov =
      45;


    /* ==============================================
       CAMERA CLIPPING
    ============================================== */

    camera.near =

      Math.max(

        maxDim * 0.0001,

        0.0001

      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ==============================================
       ANIMATION
    ============================================== */

    if (
      gltf.animations.length > 0
    ) {


      mixer =

        new THREE.AnimationMixer(
          model
        );


      const action =

        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(

        THREE.LoopRepeat,

        Infinity

      );


      /*
        KEEP ANIMATION AT 0.1×
      */

      action.timeScale =
        0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

  },


  function(xhr) {


    if (
      xhr.total
    ) {


      console.log(

        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)

        + '% loaded'

      );

    }

  },


  function(error) {


    console.error(
      'GLB loading error:',
      error
    );

  }

);


/* ==================================================
   CAMERA DEBUG
   PRESS P
================================================== */

const cameraInfo =
  document.createElement(
    'div'
  );


cameraInfo.style.position =
  'fixed';


cameraInfo.style.top =
  '20px';


cameraInfo.style.left =
  '20px';


cameraInfo.style.zIndex =
  '9999';


cameraInfo.style.padding =
  '12px 16px';


cameraInfo.style.background =
  'rgba(0,0,0,0.8)';


cameraInfo.style.color =
  'white';


cameraInfo.style.fontFamily =
  'monospace';


cameraInfo.style.fontSize =
  '13px';


cameraInfo.style.lineHeight =
  '1.6';


cameraInfo.style.borderRadius =
  '6px';


cameraInfo.style.display =
  'none';


cameraInfo.style.pointerEvents =
  'none';


document.body.appendChild(
  cameraInfo
);


window.addEventListener(

  'keydown',

  function(event) {


    if (
      event.key.toLowerCase()
      === 'p'
    ) {


      const text =
`CAMERA POSITION:
${camera.position.x},
${camera.position.y},
${camera.position.z}

CAMERA TARGET:
${controls.target.x},
${controls.target.y},
${controls.target.z}

CAMERA FOV:
${camera.fov}`;


      cameraInfo.innerText =
        text;


      cameraInfo.style.display =
        'block';


      console.log(
        text
      );


      navigator.clipboard

        .writeText(
          text
        )

        .catch(
          () => {}
        );

    }

  }

);


/* ==================================================
   ANIMATION LOOP
================================================== */

const clock =
  new THREE.Clock();


function animate() {


  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if (
    mixer
  ) {

    mixer.update(
      delta
    );

  }


  /*
    Galaxy stays centered
    around camera.
  */

  if (
    galaxySphere
  ) {

    galaxySphere.position.copy(
      camera.position
    );

  }


  controls.update();


  renderer.render(

    scene,

    camera

  );

}


animate();


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

  'resize',

  function() {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }

);


</script>

</body>

</html>
