<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>

<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


/* ========================================
   SCENE
======================================== */

const scene =
  new THREE.Scene();


/* ========================================
   CAMERA
======================================== */

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.001,
    10000
  );


/* ========================================
   RENDERER
======================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


/*
  Slightly brighter than before,
  but still keep deep blacks.
*/

renderer.toneMappingExposure =
  1.25;


document.body.appendChild(
  renderer.domElement
);


/* ========================================
   PMREM

   Makes the environment behave
   more naturally with PBR materials.
======================================== */

const pmremGenerator =
  new THREE.PMREMGenerator(
    renderer
  );


pmremGenerator.compileEquirectangularShader();


/* ========================================
   ENVIRONMENT
   Space_4.jpg
======================================== */

const textureLoader =
  new THREE.TextureLoader();


textureLoader.load(

  './Space_4.jpg',

  function(texture) {

    texture.mapping =
      THREE.EquirectangularReflectionMapping;


    texture.colorSpace =
      THREE.SRGBColorSpace;


    /* ====================================
       VISIBLE GALAXY BACKGROUND

       Keep this at 0° so the galaxy
       remains visible in the composition.
    ==================================== */

    scene.background =
      texture;


    scene.backgroundRotation.y =
      THREE.MathUtils.degToRad(
        0
      );


    /*
      Brighten visible background
      independently from reflections.
    */

    scene.backgroundIntensity =
      1.35;


    /* ====================================
       PBR ENVIRONMENT

       Use PMREM for softer,
       more natural reflection.
    ==================================== */

    const envMap =
      pmremGenerator
        .fromEquirectangular(
          texture
        )
        .texture;


    scene.environment =
      envMap;


    /*
      Reflection / lighting intensity.
    */

    scene.environmentIntensity =
      1.15;


    /*
      Sketchfab environment orientation.

      We rotate LIGHTING separately
      from the visible galaxy.
    */

    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(
        133.333
      );


    console.log(
      'Space_4 environment loaded'
    );

  },


  undefined,


  function(error) {

    console.error(
      'Space_4.jpg loading error:',
      error
    );

  }

);


/* ========================================
   CONTROLS
======================================== */

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );


controls.enableDamping =
  true;


controls.dampingFactor =
  0.05;


/* Rotate */

controls.enableRotate =
  true;


controls.rotateSpeed =
  0.7;


/* Zoom */

controls.enableZoom =
  true;


controls.zoomSpeed =
  0.5;


/* Pan */

controls.enablePan =
  true;


controls.panSpeed =
  0.8;


/* ========================================
   MOUSE MAPPING
======================================== */


/* Left drag = rotate */

controls.mouseButtons.LEFT =
  THREE.MOUSE.ROTATE;


/* Middle mouse drag = pan */

controls.mouseButtons.MIDDLE =
  THREE.MOUSE.PAN;


/* Right drag = pan */

controls.mouseButtons.RIGHT =
  THREE.MOUSE.PAN;


/* Full horizontal rotation */

controls.minAzimuthAngle =
  -Infinity;


controls.maxAzimuthAngle =
  Infinity;


/* Vertical range */

controls.minPolarAngle =
  0.15;


controls.maxPolarAngle =
  Math.PI - 0.15;


/* ========================================
   SOFT WARM FILL LIGHTING

   No directional lights.
   No hard specular light dots.
======================================== */


/*
  Very soft warm ambient fill.
*/

const ambientLight =
  new THREE.AmbientLight(

    0xffd6a0,

    0.13

  );


scene.add(
  ambientLight
);


/*
  Gentle warm hemisphere fill.

  Gives softer diffuse shading
  without looking like a spotlight.
*/

const hemiLight =
  new THREE.HemisphereLight(

    0xffd7a3,

    0x08090f,

    0.20

  );


scene.add(
  hemiLight
);


/* ========================================
   LOAD MODEL
======================================== */

const loader =
  new GLTFLoader();


let mixer =
  null;


loader.load(

  './xuanzhuan.glb',


  function(gltf) {

    const model =
      gltf.scene;


    scene.add(
      model
    );


    /* ====================================
       MATERIAL SETTINGS
    ==================================== */

    model.traverse(
      function(child) {

        if (
          child.isMesh
        ) {

          const materials =
            Array.isArray(
              child.material
            )

              ? child.material

              : [child.material];


          materials.forEach(
            function(material) {


              /* ==========================
                 DOUBLE SIDED
              ========================== */

              material.side =
                THREE.DoubleSide;


              /* ==========================
                 ROUGHNESS

                 Softer than the previous
                 mirror-like roughness 0.
              ========================== */

              if (
                'roughness'
                in material
              ) {

                material.roughness =
                  0.32;

              }


              /* ==========================
                 ENVIRONMENT REFLECTION
              ========================== */

              if (
                'envMapIntensity'
                in material
              ) {

                material.envMapIntensity =
                  1.15;

              }


              /* ==========================
                 CLEAR COAT

                 Keep glossy coating,
                 but not pure mirror.
              ========================== */

              if (
                material.isMeshPhysicalMaterial
              ) {

                material.clearcoat =
                  0.55;


                material.clearcoatRoughness =
                  0.18;

              }


              material.needsUpdate =
                true;

            }
          );

        }

      }
    );


    /* ====================================
       MODEL SIZE
    ==================================== */

    const box =
      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    /* ====================================
       FINAL CAMERA
    ==================================== */

    camera.position.set(

      15.171516053292628,

      10.454050081356264,

      26.37052839095844

    );


    controls.target.set(

      -19.08847540973339,

      -14.854545050438084,

      -4.799034101529445

    );


    camera.fov =
      45;


    /* ====================================
       CAMERA CLIPPING
    ==================================== */

    camera.near =
      Math.max(
        maxDim * 0.0001,
        0.0001
      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ====================================
       ANIMATION
    ==================================== */

    if (
      gltf.animations.length > 0
    ) {

      mixer =
        new THREE.AnimationMixer(
          model
        );


      const action =
        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(
        THREE.LoopRepeat,
        Infinity
      );


      /*
        Keep animation at 0.1×
      */

      action.timeScale =
        0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

  },


  function(xhr) {

    if (
      xhr.total
    ) {

      console.log(
        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)
        + '% loaded'
      );

    }

  },


  function(error) {

    console.error(
      'GLB loading error:',
      error
    );

  }

);


/* ========================================
   CAMERA DEBUG
   PRESS P
======================================== */

const cameraInfo =
  document.createElement(
    'div'
  );


cameraInfo.style.position =
  'fixed';

cameraInfo.style.top =
  '20px';

cameraInfo.style.left =
  '20px';

cameraInfo.style.zIndex =
  '9999';

cameraInfo.style.padding =
  '12px 16px';

cameraInfo.style.background =
  'rgba(0,0,0,0.8)';

cameraInfo.style.color =
  'white';

cameraInfo.style.fontFamily =
  'monospace';

cameraInfo.style.fontSize =
  '13px';

cameraInfo.style.lineHeight =
  '1.6';

cameraInfo.style.borderRadius =
  '6px';

cameraInfo.style.display =
  'none';

cameraInfo.style.pointerEvents =
  'none';


document.body.appendChild(
  cameraInfo
);


window.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key.toLowerCase()
      === 'p'
    ) {

      const text =
`CAMERA POSITION:
${camera.position.x},
${camera.position.y},
${camera.position.z}

CAMERA TARGET:
${controls.target.x},
${controls.target.y},
${controls.target.z}

CAMERA FOV:
${camera.fov}`;


      cameraInfo.innerText =
        text;


      cameraInfo.style.display =
        'block';


      console.log(
        text
      );


      navigator.clipboard
        .writeText(
          text
        )
        .catch(
          () => {}
        );

    }

  }
);


/* ========================================
   ANIMATION LOOP
======================================== */

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if (
    mixer
  ) {

    mixer.update(
      delta
    );

  }


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();


/* ========================================
   RESPONSIVE
======================================== */

window.addEventListener(
  'resize',
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


</script>

</body>

</html>
