<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>

<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


/* ========================================
   SCENE
======================================== */

const scene =
  new THREE.Scene();


/* ========================================
   CAMERA
   FOV = 45
======================================== */

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.001,
    10000
  );


/* ========================================
   RENDERER
======================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


/*
  Keep deep blacks
*/

renderer.toneMappingExposure =
  1.1;


document.body.appendChild(
  renderer.domElement
);


/* ========================================
   SPACE ENVIRONMENT
   space_2.jpg
======================================== */

const textureLoader =
  new THREE.TextureLoader();


textureLoader.load(

  './space_2.jpg',

  function(texture) {

    texture.mapping =
      THREE.EquirectangularReflectionMapping;


    texture.colorSpace =
      THREE.SRGBColorSpace;


    /* Visible background */

    scene.background =
      texture;


    /* PBR environment */

    scene.environment =
      texture;


    /*
      Environment reflection strength
    */

    scene.environmentIntensity =
      1.25;


    /*
      Environment rotation
    */

    scene.backgroundRotation.y =
      THREE.MathUtils.degToRad(0);


    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(0);


    console.log(
      'space_2 environment loaded'
    );

  },


  undefined,


  function(error) {

    console.error(
      'Environment loading error:',
      error
    );

  }

);


/* ========================================
   CONTROLS
======================================== */

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );


/* Smooth */

controls.enableDamping =
  true;


controls.dampingFactor =
  0.05;


/* Rotation */

controls.enableRotate =
  true;


controls.rotateSpeed =
  0.7;


/* Mouse wheel scroll = zoom */

controls.enableZoom =
  true;


controls.zoomSpeed =
  0.5;


/* Pan */

controls.enablePan =
  true;


controls.panSpeed =
  0.8;


/* ========================================
   MOUSE CONTROLS
======================================== */


/*
  LEFT DRAG
  = ROTATE
*/

controls.mouseButtons.LEFT =
  THREE.MOUSE.ROTATE;


/*
  PRESS MIDDLE MOUSE / WHEEL
  + DRAG
  = PAN
*/

controls.mouseButtons.MIDDLE =
  THREE.MOUSE.PAN;


/*
  RIGHT DRAG
  = PAN
*/

controls.mouseButtons.RIGHT =
  THREE.MOUSE.PAN;


/* Horizontal rotation */

controls.minAzimuthAngle =
  -Infinity;


controls.maxAzimuthAngle =
  Infinity;


/* Vertical rotation */

controls.minPolarAngle =
  0.15;


controls.maxPolarAngle =
  Math.PI - 0.15;


/* ========================================
   WARM SOFT LIGHTING
======================================== */


/*
  Very subtle warm ambient fill

  No hard directional lights,
  so we avoid obvious light dots.
*/

const ambientLight =
  new THREE.AmbientLight(

    0xffc77a,

    0.16

  );


scene.add(
  ambientLight
);


/*
  Soft warm hemisphere light

  Top:
  warm golden / cream

  Bottom:
  very dark warm brown

  This creates a softer
  gold / bronze feeling.
*/

const hemiLight =
  new THREE.HemisphereLight(

    0xffc36b,

    0x120906,

    0.28

  );


scene.add(
  hemiLight
);


/* ========================================
   LOAD MODEL
======================================== */

const loader =
  new GLTFLoader();


let mixer =
  null;


loader.load(

  './xuanzhuan.glb',


  function(gltf) {

    const model =
      gltf.scene;


    scene.add(
      model
    );


    /* ====================================
       MATERIAL SETTINGS
    ==================================== */

    model.traverse(
      function(child) {

        if (
          child.isMesh
        ) {

          const materials =
            Array.isArray(
              child.material
            )

              ? child.material

              : [child.material];


          materials.forEach(
            function(material) {


              /*
                Camera is inside,
                so render both sides.
              */

              material.side =
                THREE.DoubleSide;


              /*
                Environment reflections
              */

              if (
                'envMapIntensity'
                in material
              ) {

                material.envMapIntensity =
                  1.2;

              }


              material.needsUpdate =
                true;

            }
          );

        }

      }
    );


    /* ====================================
       MODEL SIZE
    ==================================== */

    const box =
      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    /* ====================================
       CURRENT CAMERA POSITION

       Keep your latest position for now.
       Because FOV changed to 45,
       you will probably want to
       reposition this again.
    ==================================== */

    camera.position.set(

      9.086131739355125,

      5.890803518806088,

      18.948786602224622

    );


    controls.target.set(

      -18.90314037413767,

      -14.336285664474662,

      -5.384827484565529

    );


    /*
      FOV = 45
      Matching your Sketchfab setting.
    */

    camera.fov =
      45;


    /* ====================================
       CAMERA CLIPPING
    ==================================== */

    camera.near =
      Math.max(
        maxDim * 0.0001,
        0.0001
      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ====================================
       ANIMATION
    ==================================== */

    if (
      gltf.animations.length > 0
    ) {

      mixer =
        new THREE.AnimationMixer(
          model
        );


      const action =
        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(
        THREE.LoopRepeat,
        Infinity
      );


      /*
        IMPORTANT:
        KEEP ANIMATION AT 0.1x
      */

      action.timeScale =
        0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

  },


  function(xhr) {

    if (
      xhr.total
    ) {

      console.log(
        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)
        + '% loaded'
      );

    }

  },


  function(error) {

    console.error(
      'GLB loading error:',
      error
    );

  }

);


/* ========================================
   CAMERA DEBUG
   PRESS P
======================================== */

const cameraInfo =
  document.createElement(
    'div'
  );


cameraInfo.style.position =
  'fixed';

cameraInfo.style.top =
  '20px';

cameraInfo.style.left =
  '20px';

cameraInfo.style.zIndex =
  '9999';

cameraInfo.style.padding =
  '12px 16px';

cameraInfo.style.background =
  'rgba(0,0,0,0.8)';

cameraInfo.style.color =
  'white';

cameraInfo.style.fontFamily =
  'monospace';

cameraInfo.style.fontSize =
  '13px';

cameraInfo.style.lineHeight =
  '1.6';

cameraInfo.style.borderRadius =
  '6px';

cameraInfo.style.display =
  'none';

cameraInfo.style.pointerEvents =
  'none';


document.body.appendChild(
  cameraInfo
);


window.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key.toLowerCase()
      === 'p'
    ) {

      const text =
`CAMERA POSITION:
${camera.position.x},
${camera.position.y},
${camera.position.z}

CAMERA TARGET:
${controls.target.x},
${controls.target.y},
${controls.target.z}

CAMERA FOV:
${camera.fov}`;


      cameraInfo.innerText =
        text;


      cameraInfo.style.display =
        'block';


      console.log(
        text
      );


      navigator.clipboard
        .writeText(
          text
        )
        .catch(
          () => {}
        );

    }

  }
);


/* ========================================
   ANIMATION LOOP
======================================== */

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if (
    mixer
  ) {

    mixer.update(
      delta
    );

  }


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();


/* ========================================
   RESPONSIVE
======================================== */

window.addEventListener(
  'resize',
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


</script>

</body>

</html>
