<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>

<body>

<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


/* ========================================
   SCENE
======================================== */

const scene = new THREE.Scene();


/* ========================================
   CAMERA
======================================== */

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.001,
  10000
);


/* ========================================
   RENDERER
======================================== */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


/*
  Slightly darker than before
  to keep the black-space feeling.
*/

renderer.toneMappingExposure = 1.25;


document.body.appendChild(
  renderer.domElement
);


/* ========================================
   SPACE ENVIRONMENT
   space_2.jpg
======================================== */

const textureLoader =
  new THREE.TextureLoader();


textureLoader.load(

  './space_2.jpg',

  function(texture) {

    texture.mapping =
      THREE.EquirectangularReflectionMapping;

    texture.colorSpace =
      THREE.SRGBColorSpace;


    /* Visible background */

    scene.background =
      texture;


    /* Reflections */

    scene.environment =
      texture;


    /*
      Lower than before.

      This reduces the reddish/orange
      contribution coming from the JPG.
    */

    scene.environmentIntensity =
      0.75;


    scene.backgroundRotation.y =
      THREE.MathUtils.degToRad(0);


    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(0);


    console.log(
      'space_2.jpg loaded'
    );

  },

  undefined,

  function(error) {

    console.error(
      'Environment loading error:',
      error
    );

  }

);


/* ========================================
   CONTROLS
======================================== */

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );


/* Smooth movement */

controls.enableDamping =
  true;

controls.dampingFactor =
  0.05;


/* Rotation */

controls.enableRotate =
  true;

controls.rotateSpeed =
  0.7;


/* Wheel scroll = zoom */

controls.enableZoom =
  true;

controls.zoomSpeed =
  0.5;


/* Pan */

controls.enablePan =
  true;

controls.panSpeed =
  0.8;


/* ========================================
   MOUSE BUTTON MAPPING
======================================== */


/*
  LEFT DRAG
  = ROTATE
*/

controls.mouseButtons.LEFT =
  THREE.MOUSE.ROTATE;


/*
  PRESS MIDDLE MOUSE / WHEEL
  + DRAG
  = PAN

  This lets you move the whole
  composition up/down/left/right.
*/

controls.mouseButtons.MIDDLE =
  THREE.MOUSE.PAN;


/*
  RIGHT DRAG
  = PAN too
*/

controls.mouseButtons.RIGHT =
  THREE.MOUSE.PAN;


/* Full horizontal rotation */

controls.minAzimuthAngle =
  -Infinity;

controls.maxAzimuthAngle =
  Infinity;


/* Vertical rotation */

controls.minPolarAngle =
  0.15;

controls.maxPolarAngle =
  Math.PI - 0.15;


/* ========================================
   LIGHTING
======================================== */


/*
  Very subtle cool ambient light.

  The previous white ambient was 1.5.
  This one is much weaker and slightly blue.
*/

const ambientLight =
  new THREE.AmbientLight(
    0x8faeff,
    0.22
  );

scene.add(
  ambientLight
);


/*
  BLUE KEY LIGHT

  Main blue highlight.
  Positioned upper-left/front.
*/

const blueKeyLight =
  new THREE.DirectionalLight(
    0x5f8fff,
    3.2
  );

blueKeyLight.position.set(
  -8,
  6,
  8
);

scene.add(
  blueKeyLight
);


/*
  DEEP BLUE RIM LIGHT

  Comes from the opposite side,
  creating blue edges around
  spheres and rings.
*/

const blueRimLight =
  new THREE.DirectionalLight(
    0x244dff,
    2.4
  );

blueRimLight.position.set(
  8,
  -4,
  -6
);

scene.add(
  blueRimLight
);


/* ========================================
   LOAD MODEL
======================================== */

const loader =
  new GLTFLoader();


let mixer =
  null;


loader.load(

  './xuanzhuan.glb',


  function(gltf) {

    const model =
      gltf.scene;


    scene.add(
      model
    );


    /* ====================================
       MATERIAL SETTINGS
    ==================================== */

    model.traverse(
      function(child) {

        if (
          child.isMesh
        ) {

          const materials =
            Array.isArray(
              child.material
            )
              ? child.material
              : [child.material];


          materials.forEach(
            function(material) {


              /*
                Render inside + outside
              */

              material.side =
                THREE.DoubleSide;


              /*
                Reduce environment reflection
                so space_2 doesn't overpower
                the blue lights.
              */

              if (
                'envMapIntensity'
                in material
              ) {

                material.envMapIntensity =
                  0.85;

              }


              material.needsUpdate =
                true;

            }
          );

        }

      }
    );


    /* ====================================
       MODEL SIZE
    ==================================== */

    const box =
      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    /* ====================================
       CURRENT CAMERA START POSITION

       Keep this for now.
       You can adjust it again.
    ==================================== */

    camera.position.set(

      -10.270741824643428,

      -3.5428384421134655,

      18.772016980965745

    );


    controls.target.set(

      -11.328824611395275,

      -8.301359579118229,

      -39.080314964653574

    );


    camera.fov =
      70;


    /* ====================================
       CAMERA CLIPPING
    ==================================== */

    camera.near =
      Math.max(
        maxDim * 0.0001,
        0.0001
      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ====================================
       ANIMATION
    ==================================== */

    if (
      gltf.animations.length > 0
    ) {

      mixer =
        new THREE.AnimationMixer(
          model
        );


      const action =
        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(
        THREE.LoopRepeat,
        Infinity
      );


      /*
        KEEP ANIMATION AT 0.1x
      */

      action.timeScale =
        0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

  },


  function(xhr) {

    if (
      xhr.total
    ) {

      console.log(
        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)
        + '% loaded'
      );

    }

  },


  function(error) {

    console.error(
      'GLB loading error:',
      error
    );

  }

);


/* ========================================
   CAMERA DEBUG
   PRESS P
======================================== */

const cameraInfo =
  document.createElement(
    'div'
  );


cameraInfo.style.position =
  'fixed';

cameraInfo.style.top =
  '20px';

cameraInfo.style.left =
  '20px';

cameraInfo.style.zIndex =
  '9999';

cameraInfo.style.padding =
  '12px 16px';

cameraInfo.style.background =
  'rgba(0,0,0,0.8)';

cameraInfo.style.color =
  'white';

cameraInfo.style.fontFamily =
  'monospace';

cameraInfo.style.fontSize =
  '13px';

cameraInfo.style.lineHeight =
  '1.6';

cameraInfo.style.borderRadius =
  '6px';

cameraInfo.style.display =
  'none';

cameraInfo.style.pointerEvents =
  'none';


document.body.appendChild(
  cameraInfo
);


window.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key.toLowerCase()
      === 'p'
    ) {

      const text =
`CAMERA POSITION:
${camera.position.x},
${camera.position.y},
${camera.position.z}

CAMERA TARGET:
${controls.target.x},
${controls.target.y},
${controls.target.z}

CAMERA FOV:
${camera.fov}`;


      cameraInfo.innerText =
        text;


      cameraInfo.style.display =
        'block';


      console.log(
        text
      );


      navigator.clipboard
        .writeText(
          text
        )
        .catch(
          () => {}
        );

    }

  }
);


/* ========================================
   ANIMATION LOOP
======================================== */

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if (
    mixer
  ) {

    mixer.update(
      delta
    );

  }


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();


/* ========================================
   RESPONSIVE
======================================== */

window.addEventListener(
  'resize',
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


</script>

</body>

</html>
