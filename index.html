<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>

<script type="module">

/* ========================================
   IMPORTS
======================================== */

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


/* ========================================
   SCENE
======================================== */

const scene = new THREE.Scene();


/* ========================================
   CAMERA
======================================== */

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.001,
  10000
);


/* ========================================
   RENDERER
======================================== */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.5;

document.body.appendChild(
  renderer.domElement
);


/* ========================================
   GALAXY ENVIRONMENT
======================================== */

const textureLoader =
  new THREE.TextureLoader();

textureLoader.load(

  './material_0_baseColor.png',

  function(texture) {

    texture.mapping =
      THREE.EquirectangularReflectionMapping;

    texture.colorSpace =
      THREE.SRGBColorSpace;


    /* Visible galaxy background */

    scene.background = texture;


    /* Galaxy reflections */

    scene.environment = texture;


    /* Environment brightness */

    scene.environmentIntensity = 1.5;


    /* Galaxy rotation */

    scene.backgroundRotation.y =
      THREE.MathUtils.degToRad(0);

    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(0);

  },

  undefined,

  function(error) {

    console.error(
      'Galaxy texture loading error:',
      error
    );

  }

);


/* ========================================
   CONTROLS
======================================== */

const controls = new OrbitControls(
  camera,
  renderer.domElement
);


/*
  Smooth movement
*/

controls.enableDamping = true;

controls.dampingFactor = 0.05;


/*
  LEFT MOUSE:
  rotate / look around
*/

controls.enableRotate = true;

controls.rotateSpeed = 0.7;


/*
  MOUSE WHEEL:
  zoom in / out
*/

controls.enableZoom = true;

controls.zoomSpeed = 0.5;


/*
  RIGHT MOUSE:
  move view up/down/left/right
*/

controls.enablePan = true;

controls.panSpeed = 0.8;


/*
  Full horizontal rotation
*/

controls.minAzimuthAngle = -Infinity;

controls.maxAzimuthAngle = Infinity;


/*
  Vertical rotation range
*/

controls.minPolarAngle = 0.15;

controls.maxPolarAngle =
  Math.PI - 0.15;


/* ========================================
   LIGHTING
======================================== */

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    1.5
  );

scene.add(ambientLight);


const hemiLight =
  new THREE.HemisphereLight(
    0xffffff,
    0x222233,
    2
  );

scene.add(hemiLight);


/* ========================================
   LOAD MODEL
======================================== */

const loader = new GLTFLoader();

let mixer = null;


loader.load(

  './xuanzhuan.glb',


  /* SUCCESS */

  function(gltf) {

    const model = gltf.scene;

    scene.add(model);


    /* ====================================
       MATERIAL SETTINGS
    ==================================== */

    model.traverse(function(child) {

      if (child.isMesh) {

        const materials =
          Array.isArray(child.material)
            ? child.material
            : [child.material];


        materials.forEach(
          function(material) {

            /*
              Render surfaces
              from both sides
            */

            material.side =
              THREE.DoubleSide;


            /*
              Galaxy reflection
              strength
            */

            if (
              'envMapIntensity'
              in material
            ) {

              material.envMapIntensity =
                1.5;

            }


            material.needsUpdate =
              true;

          }
        );

      }

    });


    /* ====================================
       MODEL DIMENSIONS
    ==================================== */

    const box =
      new THREE.Box3().setFromObject(model);


    const center =
      box.getCenter(
        new THREE.Vector3()
      );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    /* ====================================
       DEFAULT CAMERA POSITION
       START INSIDE
    ==================================== */

    camera.position.set(

      center.x,

      center.y,

      center.z + maxDim * 0.12

    );


    /*
      Camera look target
    */

    controls.target.set(

      center.x,

      center.y,

      center.z - maxDim * 0.30

    );


    camera.near =
      Math.max(
        maxDim * 0.0001,
        0.0001
      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ====================================
       BLENDER ANIMATION
    ==================================== */

    if (gltf.animations.length > 0) {

      mixer =
        new THREE.AnimationMixer(
          model
        );


      const action =
        mixer.clipAction(
          gltf.animations[0]
        );


      /*
        Infinite loop
      */

      action.setLoop(
        THREE.LoopRepeat,
        Infinity
      );


      /*
        IMPORTANT

        Animation playback speed:
        0.1x
      */

      action.timeScale = 0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );


    console.log(
      'Model center:',
      center
    );


    console.log(
      'Model size:',
      size
    );

  },


  /* PROGRESS */

  function(xhr) {

    if (xhr.total) {

      console.log(
        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)
        + '% loaded'
      );

    }

  },


  /* ERROR */

  function(error) {

    console.error(
      'GLB loading error:',
      error
    );

  }

);


/* ========================================
   CAMERA DEBUG

   Adjust your view,
   then press P.

   Open Chrome:
   Inspect → Console

   Copy the values to ChatGPT.
======================================== */

window.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key.toLowerCase()
      === 'p'
    ) {

      console.log(
        'CAMERA POSITION:',
        camera.position.x,
        camera.position.y,
        camera.position.z
      );


      console.log(
        'CAMERA TARGET:',
        controls.target.x,
        controls.target.y,
        controls.target.z
      );


      console.log(
        'CAMERA FOV:',
        camera.fov
      );

    }

  }
);


/* ========================================
   ANIMATION
======================================== */

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  /*
    Update Blender animation
  */

  if (mixer) {

    mixer.update(delta);

  }


  /*
    Update camera controls
  */

  controls.update();


  /*
    Render
  */

  renderer.render(
    scene,
    camera
  );

}


animate();


/* ========================================
   RESPONSIVE
======================================== */

window.addEventListener(
  'resize',
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


</script>

</body>

</html>
