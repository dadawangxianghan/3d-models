<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>


<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


/* ==================================================
   SCENE
================================================== */

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(
    0x000000
  );


/* ==================================================
   CAMERA
================================================== */

const camera =
  new THREE.PerspectiveCamera(

    45,

    window.innerWidth /
    window.innerHeight,

    0.001,

    10000

  );


/* ==================================================
   RENDERER
================================================== */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    alpha: false

  });


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  1.15;


document.body.appendChild(
  renderer.domElement
);


/* ==================================================
   CONTROLS
================================================== */

const controls =
  new OrbitControls(

    camera,

    renderer.domElement

  );


controls.enableDamping =
  true;


controls.dampingFactor =
  0.05;


controls.enableRotate =
  true;


controls.rotateSpeed =
  0.7;


controls.enableZoom =
  true;


controls.zoomSpeed =
  0.5;


controls.enablePan =
  true;


controls.panSpeed =
  0.8;


/* LEFT = ROTATE */

controls.mouseButtons.LEFT =
  THREE.MOUSE.ROTATE;


/* MIDDLE = PAN */

controls.mouseButtons.MIDDLE =
  THREE.MOUSE.PAN;


/* RIGHT = PAN */

controls.mouseButtons.RIGHT =
  THREE.MOUSE.PAN;


controls.minAzimuthAngle =
  -Infinity;


controls.maxAzimuthAngle =
  Infinity;


controls.minPolarAngle =
  0.15;


controls.maxPolarAngle =
  Math.PI - 0.15;


/* ==================================================
   TEXTURE LOADER
================================================== */

const textureLoader =
  new THREE.TextureLoader();


/* ==================================================
   GALAXY BACKGROUND
================================================== */

let galaxySphere =
  null;


textureLoader.load(

  './Space_4.jpg',

  function(texture) {


    texture.colorSpace =
      THREE.SRGBColorSpace;


    const galaxyGeometry =
      new THREE.SphereGeometry(

        500,

        64,

        32

      );


    const galaxyMaterial =
      new THREE.ShaderMaterial({


        side:
          THREE.BackSide,


        depthWrite:
          false,


        depthTest:
          false,


        toneMapped:
          false,


        uniforms: {


          galaxyTexture: {

            value: texture

          },


          /*
            Visible galaxy brightness.
            Does NOT control model lighting.
          */

          brightness: {

            value: 1.05

          }

        },


        vertexShader: `

          varying vec2 vUv;


          void main() {

            vUv =
              uv;


            gl_Position =

              projectionMatrix *

              modelViewMatrix *

              vec4(
                position,
                1.0
              );

          }

        `,


        fragmentShader: `

          uniform sampler2D
            galaxyTexture;


          uniform float
            brightness;


          varying vec2
            vUv;


          void main() {


            vec3 color =

              texture2D(

                galaxyTexture,

                vUv

              ).rgb;


            color *=
              brightness;


            gl_FragColor =

              vec4(

                color,

                1.0

              );

          }

        `

      });


    galaxySphere =
      new THREE.Mesh(

        galaxyGeometry,

        galaxyMaterial

      );


    galaxySphere.rotation.y =
      THREE.MathUtils.degToRad(
        0
      );


    galaxySphere.renderOrder =
      -1000;


    scene.add(
      galaxySphere
    );


    console.log(
      'Galaxy background loaded'
    );

  }

);


/* ==================================================
   PBR ENVIRONMENT
================================================== */

const pmremGenerator =
  new THREE.PMREMGenerator(
    renderer
  );


pmremGenerator
  .compileEquirectangularShader();


textureLoader.load(

  './Space_4.jpg',

  function(texture) {


    texture.mapping =
      THREE.EquirectangularReflectionMapping;


    texture.colorSpace =
      THREE.SRGBColorSpace;


    const envMap =

      pmremGenerator

        .fromEquirectangular(
          texture
        )

        .texture;


    scene.environment =
      envMap;


    /*
      UPDATED:
      Environment intensity = 3
    */

    scene.environmentIntensity =
      3;


    /*
      Sketchfab environment orientation
    */

    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(
        133.333
      );


    console.log(
      'PBR environment loaded'
    );

  }

);


/* ==================================================
   SOFT DIFFUSE FILL
================================================== */

const ambientLight =
  new THREE.AmbientLight(

    0xffead6,

    0.65

  );


scene.add(
  ambientLight
);


const hemisphereLight =
  new THREE.HemisphereLight(

    0xffd6a3,

    0x10182c,

    0.75

  );


scene.add(
  hemisphereLight
);


/* ==================================================
   WARM AREA LIGHT
================================================== */

const warmAreaLight =
  new THREE.RectAreaLight(

    0xffc98a,

    2.2,

    18,

    18

  );


warmAreaLight.position.set(

  12,

  12,

  18

);


warmAreaLight.lookAt(

  0,

  0,

  0

);


scene.add(
  warmAreaLight
);


/* ==================================================
   BLUE AREA LIGHT
================================================== */

const blueAreaLight =
  new THREE.RectAreaLight(

    0x6c8dff,

    1.4,

    20,

    20

  );


blueAreaLight.position.set(

  -15,

  5,

  10

);


blueAreaLight.lookAt(

  0,

  0,

  0

);


scene.add(
  blueAreaLight
);


/* ==================================================
   MODEL
================================================== */

const loader =
  new GLTFLoader();


let mixer =
  null;


loader.load(

  './xuanzhuan.glb',

  function(gltf) {


    const model =
      gltf.scene;


    scene.add(
      model
    );


    /* ==============================================
       MATERIALS
    ============================================== */

    model.traverse(

      function(child) {


        if (
          !child.isMesh
        ) {

          return;

        }


        const materials =

          Array.isArray(
            child.material
          )

          ? child.material

          : [child.material];


        materials.forEach(

          function(material) {


            material.side =
              THREE.DoubleSide;


            /*
              Keep some diffuse softness.
            */

            if (
              'roughness'
              in material
            ) {


              material.roughness =

                Math.max(

                  material.roughness,

                  0.28

                );

            }


            /*
              Material reflection strength.
            */

            if (
              'envMapIntensity'
              in material
            ) {


              material.envMapIntensity =
                1.25;

            }


            /*
              Preserve and soften clearcoat.
            */

            if (
              material.isMeshPhysicalMaterial
            ) {


              if (
                material.clearcoat > 0
              ) {


                material.clearcoat =

                  Math.min(

                    material.clearcoat,

                    0.7

                  );


                material.clearcoatRoughness =

                  Math.max(

                    material.clearcoatRoughness,

                    0.18

                  );

              }

            }


            material.needsUpdate =
              true;

          }

        );

      }

    );


    /* ==============================================
       MODEL SIZE
    ============================================== */

    const box =

      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =

      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =

      Math.max(

        size.x,

        size.y,

        size.z

      );


    /* ==============================================
       NEW CAMERA POSITION
    ============================================== */

    camera.position.set(

      -6.281442836548245,

      -0.6146532170676694,

      -15.951038145425533

    );


    /* ==============================================
       NEW CAMERA TARGET
    ============================================== */

    controls.target.set(

      6.12541642859908,

      -1.5863933753734871,

      -0.7059017212859313

    );


    /* ==============================================
       FOV
    ============================================== */

    camera.fov =
      45;


    camera.near =

      Math.max(

        maxDim * 0.0001,

        0.0001

      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ==============================================
       ANIMATION
    ============================================== */

    if (
      gltf.animations.length > 0
    ) {


      mixer =

        new THREE.AnimationMixer(
          model
        );


      const action =

        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(

        THREE.LoopRepeat,

        Infinity

      );


      /*
        KEEP ANIMATION AT 0.1x
      */

      action.timeScale =
        0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

  },


  function(xhr) {


    if (
      xhr.total
    ) {


      console.log(

        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)

        + '% loaded'

      );

    }

  },


  function(error) {


    console.error(
      'GLB loading error:',
      error
    );

  }

);


/* ==================================================
   CAMERA DEBUG
   PRESS P
================================================== */

const cameraInfo =
  document.createElement(
    'div'
  );


cameraInfo.style.position =
  'fixed';


cameraInfo.style.top =
  '20px';


cameraInfo.style.left =
  '20px';


cameraInfo.style.zIndex =
  '9999';


cameraInfo.style.padding =
  '12px 16px';


cameraInfo.style.background =
  'rgba(0,0,0,0.8)';


cameraInfo.style.color =
  'white';


cameraInfo.style.fontFamily =
  'monospace';


cameraInfo.style.fontSize =
  '13px';


cameraInfo.style.lineHeight =
  '1.6';


cameraInfo.style.borderRadius =
  '6px';


cameraInfo.style.display =
  'none';


cameraInfo.style.pointerEvents =
  'none';


document.body.appendChild(
  cameraInfo
);


window.addEventListener(

  'keydown',

  function(event) {


    if (
      event.key.toLowerCase()
      === 'p'
    ) {


      const text =
`CAMERA POSITION:
${camera.position.x},
${camera.position.y},
${camera.position.z}

CAMERA TARGET:
${controls.target.x},
${controls.target.y},
${controls.target.z}

CAMERA FOV:
${camera.fov}`;


      cameraInfo.innerText =
        text;


      cameraInfo.style.display =
        'block';


      console.log(
        text
      );


      navigator.clipboard

        .writeText(
          text
        )

        .catch(
          () => {}
        );

    }

  }

);


/* ==================================================
   ANIMATION LOOP
================================================== */

const clock =
  new THREE.Clock();


function animate() {


  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if (
    mixer
  ) {


    mixer.update(
      delta
    );

  }


  if (
    galaxySphere
  ) {


    galaxySphere.position.copy(
      camera.position
    );

  }


  controls.update();


  renderer.render(

    scene,

    camera

  );

}


animate();


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

  'resize',

  function() {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }

);


</script>

</body>

</html>
