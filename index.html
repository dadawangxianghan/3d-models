<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

  </style>


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>


<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';



/* ==================================================
   SCENE
================================================== */

const scene =
  new THREE.Scene();


/*
  Keep Scene background black.

  Galaxy will be rendered with
  a separate sphere instead.
*/

scene.background =
  new THREE.Color(0x000000);



/* ==================================================
   CAMERA
================================================== */

const camera =
  new THREE.PerspectiveCamera(

    45,

    window.innerWidth /
    window.innerHeight,

    0.001,

    10000

  );



/* ==================================================
   RENDERER
================================================== */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    alpha: false

  });


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


/*
  Slightly brighter model.

  This affects the 3D model,
  but NOT the galaxy background sphere.
*/

renderer.toneMappingExposure =
  1.35;


document.body.appendChild(
  renderer.domElement
);



/* ==================================================
   CONTROLS
================================================== */

const controls =
  new OrbitControls(

    camera,

    renderer.domElement

  );


controls.enableDamping =
  true;


controls.dampingFactor =
  0.05;


controls.enableRotate =
  true;


controls.rotateSpeed =
  0.7;


controls.enableZoom =
  true;


controls.zoomSpeed =
  0.5;


controls.enablePan =
  true;


controls.panSpeed =
  0.8;



/* LEFT = ROTATE */

controls.mouseButtons.LEFT =
  THREE.MOUSE.ROTATE;


/* MIDDLE = PAN */

controls.mouseButtons.MIDDLE =
  THREE.MOUSE.PAN;


/* RIGHT = PAN */

controls.mouseButtons.RIGHT =
  THREE.MOUSE.PAN;



controls.minAzimuthAngle =
  -Infinity;


controls.maxAzimuthAngle =
  Infinity;


controls.minPolarAngle =
  0.15;


controls.maxPolarAngle =
  Math.PI - 0.15;



/* ==================================================
   GALAXY BACKGROUND

   IMPORTANT:

   Galaxy is now independent from
   model lighting.

   This means we can make the galaxy
   clearly visible without overexposing
   the model.
================================================== */

const textureLoader =
  new THREE.TextureLoader();


let galaxySphere =
  null;


textureLoader.load(

  './Space_4.jpg',


  function(texture) {


    texture.colorSpace =
      THREE.SRGBColorSpace;


    /*
      Improve filtering.
    */

    texture.minFilter =
      THREE.LinearFilter;


    texture.magFilter =
      THREE.LinearFilter;


    /*
      Huge sphere surrounding camera.
    */

    const galaxyGeometry =
      new THREE.SphereGeometry(

        500,

        64,

        32

      );


    /*
      Custom shader.

      This allows us to boost
      ONLY the galaxy brightness.
    */

    const galaxyMaterial =
      new THREE.ShaderMaterial({


        side:
          THREE.BackSide,


        depthWrite:
          false,


        depthTest:
          false,


        toneMapped:
          false,


        uniforms: {

          galaxyTexture: {

            value: texture

          },


          /*
            GALAXY BRIGHTNESS

            Increase this if you want
            the Milky Way brighter.
          */

          brightness: {

            value: 50

          }

        },


        vertexShader: `

          varying vec2 vUv;

          void main() {

            vUv = uv;

            gl_Position =
              projectionMatrix *
              modelViewMatrix *
              vec4(
                position,
                1.0
              );

          }

        `,


        fragmentShader: `

          uniform sampler2D galaxyTexture;

          uniform float brightness;

          varying vec2 vUv;


          void main() {

            vec4 tex =
              texture2D(
                galaxyTexture,
                vUv
              );


            /*
              Lift dark galaxy areas
              without blowing out stars.
            */

            vec3 color =
              tex.rgb * brightness;


            color =
              pow(
                color,
                vec3(0.85)
              );


            gl_FragColor =
              vec4(
                color,
                1.0
              );

          }

        `

      });


    galaxySphere =
      new THREE.Mesh(

        galaxyGeometry,

        galaxyMaterial

      );


    /*
      Rotate visible galaxy.

      Change this number if you want
      another part of the Milky Way
      behind the model.
    */

    galaxySphere.rotation.y =
      THREE.MathUtils.degToRad(
        0
      );


    galaxySphere.renderOrder =
      -1000;


    scene.add(
      galaxySphere
    );


    console.log(
      'Galaxy background loaded'
    );

  },


  undefined,


  function(error) {

    console.error(
      'Galaxy background error:',
      error
    );

  }

);



/* ==================================================
   ENVIRONMENT REFLECTION

   Separate copy of Space_4
   controls PBR reflections.
================================================== */

const pmremGenerator =
  new THREE.PMREMGenerator(
    renderer
  );


pmremGenerator
  .compileEquirectangularShader();


textureLoader.load(

  './Space_4.jpg',


  function(texture) {


    texture.mapping =
      THREE.EquirectangularReflectionMapping;


    texture.colorSpace =
      THREE.SRGBColorSpace;


    const envMap =
      pmremGenerator
        .fromEquirectangular(
          texture
        )
        .texture;


    scene.environment =
      envMap;


    /*
      Reflection / IBL strength.

      Keep moderate because JPG
      is not true HDR.
    */

    scene.environmentIntensity =
      1.35;


    /*
      Sketchfab environment direction.
    */

    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(
        133.333
      );


    console.log(
      'PBR environment loaded'
    );

  }

);



/* ==================================================
   SOFT FILL LIGHTING

   JPG environment is not HDR,
   so it cannot light dark surfaces
   strongly enough by itself.

   These lights create diffuse fill
   without visible hard light spots.
================================================== */


/*
  Neutral-warm ambient fill.
*/

const ambientLight =
  new THREE.AmbientLight(

    0xffe4c4,

    1

  );


scene.add(
  ambientLight
);



/*
  Large soft sky / ground difference.

  Still no directional spotlight.
*/

const hemiLight =
  new THREE.HemisphereLight(

    0xffd8a6,

    0x171722,

    1

  );


scene.add(
  hemiLight
);



/* ==================================================
   MODEL
================================================== */

const loader =
  new GLTFLoader();


let mixer =
  null;


loader.load(

  './xuanzhuan.glb',


  function(gltf) {


    const model =
      gltf.scene;


    scene.add(
      model
    );



    /* ==============================================
       MATERIALS
    ============================================== */

    model.traverse(

      function(child) {


        if (
          !child.isMesh
        ) {

          return;

        }


        const materials =

          Array.isArray(
            child.material
          )

          ? child.material

          : [child.material];



        materials.forEach(

          function(material) {


            /*
              Camera is inside,
              render both faces.
            */

            material.side =
              THREE.DoubleSide;



            /*
              DO NOT replace every material's
              original roughness anymore.

              Only stop extremely mirror-like
              surfaces from reaching zero.
            */

            if (
              'roughness'
              in material
            ) {

              material.roughness =
                Math.max(

                  material.roughness,

                  0.20

                );

            }



            /*
              Moderate reflections.
            */

            if (
              'envMapIntensity'
              in material
            ) {

              material.envMapIntensity =
                1.25;

            }



            /*
              Preserve physical material,
              but soften clearcoat.

              No more pure mirror clearcoat.
            */

            if (
              material.isMeshPhysicalMaterial
            ) {


              if (
                material.clearcoat > 0
              ) {

                material.clearcoat =
                  Math.min(

                    material.clearcoat,

                    0.65

                  );


                material.clearcoatRoughness =
                  Math.max(

                    material.clearcoatRoughness,

                    0.16

                  );

              }

            }


            material.needsUpdate =
              true;

          }

        );

      }

    );



    /* ==============================================
       MODEL SIZE
    ============================================== */

    const box =
      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =
      Math.max(

        size.x,

        size.y,

        size.z

      );



    /* ==============================================
       FINAL CAMERA
    ============================================== */

    camera.position.set(

      15.171516053292628,

      10.454050081356264,

      26.37052839095844

    );


    controls.target.set(

      -19.08847540973339,

      -14.854545050438084,

      -4.799034101529445

    );


    camera.fov =
      45;



    camera.near =
      Math.max(

        maxDim * 0.0001,

        0.0001

      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();



    /* ==============================================
       ANIMATION
    ============================================== */

    if (
      gltf.animations.length > 0
    ) {


      mixer =
        new THREE.AnimationMixer(
          model
        );


      const action =
        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(

        THREE.LoopRepeat,

        Infinity

      );


      /*
        KEEP 0.1×
      */

      action.timeScale =
        0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

  },


  function(xhr) {


    if (
      xhr.total
    ) {


      console.log(

        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)

        + '% loaded'

      );

    }

  },


  function(error) {


    console.error(
      'GLB loading error:',
      error
    );

  }

);



/* ==================================================
   CAMERA DEBUG
   PRESS P
================================================== */

const cameraInfo =
  document.createElement(
    'div'
  );


cameraInfo.style.position =
  'fixed';


cameraInfo.style.top =
  '20px';


cameraInfo.style.left =
  '20px';


cameraInfo.style.zIndex =
  '9999';


cameraInfo.style.padding =
  '12px 16px';


cameraInfo.style.background =
  'rgba(0,0,0,0.8)';


cameraInfo.style.color =
  'white';


cameraInfo.style.fontFamily =
  'monospace';


cameraInfo.style.fontSize =
  '13px';


cameraInfo.style.lineHeight =
  '1.6';


cameraInfo.style.borderRadius =
  '6px';


cameraInfo.style.display =
  'none';


cameraInfo.style.pointerEvents =
  'none';


document.body.appendChild(
  cameraInfo
);



window.addEventListener(

  'keydown',

  function(event) {


    if (
      event.key.toLowerCase()
      === 'p'
    ) {


      const text =
`CAMERA POSITION:
${camera.position.x},
${camera.position.y},
${camera.position.z}

CAMERA TARGET:
${controls.target.x},
${controls.target.y},
${controls.target.z}

CAMERA FOV:
${camera.fov}`;


      cameraInfo.innerText =
        text;


      cameraInfo.style.display =
        'block';


      console.log(
        text
      );


      navigator.clipboard
        .writeText(
          text
        )
        .catch(
          () => {}
        );

    }

  }

);



/* ==================================================
   ANIMATION
================================================== */

const clock =
  new THREE.Clock();


function animate() {


  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if (
    mixer
  ) {

    mixer.update(
      delta
    );

  }


  /*
    Keep galaxy centered on camera.

    This makes it behave like
    infinitely distant space.
  */

  if (
    galaxySphere
  ) {

    galaxySphere.position.copy(
      camera.position
    );

  }


  controls.update();


  renderer.render(

    scene,

    camera

  );

}


animate();



/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

  'resize',

  function() {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }

);


</script>

</body>

</html>
