<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>

<script type="module">

/* ========================================
   IMPORTS
======================================== */

import * as THREE from 'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';


/* ========================================
   SCENE
======================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);


/* ========================================
   CAMERA
======================================== */

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.001,
  10000
);


/* ========================================
   RENDERER
======================================== */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;


/* Tone mapping */

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 2.0;


document.body.appendChild(
  renderer.domElement
);


/* ========================================
   CONTROLS
======================================== */

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.enableZoom = true;

controls.enablePan = false;

controls.rotateSpeed = 0.5;

controls.zoomSpeed = 0.7;


/* ========================================
   LIGHTING
======================================== */


/* General fill light */

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    3
  );

scene.add(ambientLight);


/* Soft environment-style light */

const hemiLight =
  new THREE.HemisphereLight(
    0xffffff,
    0x666666,
    4
  );

scene.add(hemiLight);


/* ========================================
   LOAD MODEL
======================================== */

const loader = new GLTFLoader();

let mixer = null;


loader.load(

  './xuanzhuan.glb',


  /* SUCCESS */

  function(gltf) {

    const model = gltf.scene;

    scene.add(model);


    /* ------------------------------------
       DOUBLE SIDED MATERIALS
       Allows camera to see inside spheres
    ------------------------------------ */

    model.traverse(function(child) {

      if (child.isMesh) {

        if (Array.isArray(child.material)) {

          child.material.forEach(
            function(material) {

              material.side =
                THREE.DoubleSide;

              material.needsUpdate =
                true;

            }
          );

        } else {

          child.material.side =
            THREE.DoubleSide;

          child.material.needsUpdate =
            true;

        }

      }

    });


    /* ====================================
       CALCULATE MODEL SIZE
    ==================================== */

    const box =
      new THREE.Box3().setFromObject(model);

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    const size =
      box.getSize(
        new THREE.Vector3()
      );

    const maxDim =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    /* ====================================
       CAMERA — START INSIDE
    ==================================== */

    camera.position.set(

      center.x,

      center.y,

      center.z + maxDim * 0.12

    );


    /*
      Look toward the interior
    */

    controls.target.set(

      center.x,

      center.y,

      center.z - maxDim * 0.30

    );


    camera.near =
      Math.max(
        maxDim * 0.0001,
        0.0001
      );

    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ====================================
       PLAY BLENDER ANIMATION
    ==================================== */

    if (gltf.animations.length > 0) {

      mixer =
        new THREE.AnimationMixer(
          model
        );


      const action =
        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(
        THREE.LoopRepeat,
        Infinity
      );


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

    console.log(
      'Animations:',
      gltf.animations
    );

    console.log(
      'Model center:',
      center
    );

    console.log(
      'Model size:',
      size
    );

  },


  /* PROGRESS */

  function(xhr) {

    if (xhr.total) {

      const percent =
        xhr.loaded /
        xhr.total *
        100;

      console.log(
        percent.toFixed(0) +
        '% loaded'
      );

    }

  },


  /* ERROR */

  function(error) {

    console.error(
      'Error loading GLB:',
      error
    );

  }

);


/* ========================================
   CLOCK
======================================== */

const clock =
  new THREE.Clock();


/* ========================================
   ANIMATION LOOP
======================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  /* Blender animation */

  if (mixer) {

    mixer.update(delta);

  }


  /* Smooth camera */

  controls.update();


  /* Render */

  renderer.render(
    scene,
    camera
  );

}


animate();


/* ========================================
   RESPONSIVE
======================================== */

window.addEventListener(
  'resize',
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


</script>

</body>

</html>
