<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>


<script type="module">

/* ==================================================
   IMPORTS
================================================== */

import * as THREE from 'three';

import {
  GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';

import {
  OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
  EffectComposer
} from 'three/addons/postprocessing/EffectComposer.js';

import {
  RenderPass
} from 'three/addons/postprocessing/RenderPass.js';

import {
  UnrealBloomPass
} from 'three/addons/postprocessing/UnrealBloomPass.js';

import {
  ShaderPass
} from 'three/addons/postprocessing/ShaderPass.js';


/* ==================================================
   SCENE
================================================== */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x000000);


/* ==================================================
   CAMERA
================================================== */

const camera =
  new THREE.PerspectiveCamera(

    45,

    window.innerWidth /
    window.innerHeight,

    0.001,

    10000

  );


/* ==================================================
   RENDERER
================================================== */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    alpha: false

  });


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  window.innerWidth,
  window.innerHeight

);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


/*
  Sketchfab screenshot:
  Tone Mapping = Reinhard
*/

renderer.toneMapping =
  THREE.ReinhardToneMapping;


/*
  Sketchfab exposure scale
  doesn't map 1:1 to Three.js.

  Start around 1.0.
*/

renderer.toneMappingExposure =
  1.0;


document.body.appendChild(
  renderer.domElement
);


/* ==================================================
   CONTROLS
================================================== */

const controls =
  new OrbitControls(

    camera,

    renderer.domElement

  );


controls.enableDamping =
  true;


controls.dampingFactor =
  0.05;


controls.enableRotate =
  true;


controls.rotateSpeed =
  0.7;


controls.enableZoom =
  true;


controls.zoomSpeed =
  0.5;


controls.enablePan =
  true;


controls.panSpeed =
  0.8;


/*
  LEFT MOUSE
  = rotate
*/

controls.mouseButtons.LEFT =
  THREE.MOUSE.ROTATE;


/*
  HOLD MIDDLE MOUSE
  = move / pan
*/

controls.mouseButtons.MIDDLE =
  THREE.MOUSE.PAN;


/*
  RIGHT MOUSE
  = move / pan
*/

controls.mouseButtons.RIGHT =
  THREE.MOUSE.PAN;


controls.minAzimuthAngle =
  -Infinity;


controls.maxAzimuthAngle =
  Infinity;


controls.minPolarAngle =
  0.15;


controls.maxPolarAngle =
  Math.PI - 0.15;


/* ==================================================
   POST PROCESSING
================================================== */

const composer =
  new EffectComposer(
    renderer
  );


composer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


composer.setSize(

  window.innerWidth,

  window.innerHeight

);


/* ==================================================
   NORMAL RENDER PASS
================================================== */

const renderPass =
  new RenderPass(

    scene,

    camera

  );


composer.addPass(
  renderPass
);


/* ==================================================
   BLOOM

   Sketchfab reference:

   Threshold  = 0.177
   Intensity  = 0.5
   Radius     = 0.533

   Three.js UnrealBloom isn't numerically identical,
   but these are a good starting translation.
================================================== */

const bloomPass =
  new UnrealBloomPass(

    new THREE.Vector2(

      window.innerWidth,

      window.innerHeight

    ),

    0.50,   // strength

    0.53,   // radius

    0.18    // threshold

  );


composer.addPass(
  bloomPass
);


/* ==================================================
   VIGNETTE + SHARPEN PASS

   Sketchfab reference:

   Vignette:
   amount   = 0.567
   hardness = 0.478

   Sharpness:
   0.2
================================================== */

const finalShader = {

  uniforms: {

    tDiffuse: {
      value: null
    },

    resolution: {
      value: new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
      )
    },

    vignetteAmount: {
      value: 0.567
    },

    vignetteHardness: {
      value: 0.478
    },

    sharpness: {
      value: 0.20
    }

  },


  vertexShader: `

    varying vec2 vUv;

    void main() {

      vUv = uv;

      gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(position, 1.0);

    }

  `,


  fragmentShader: `

    uniform sampler2D tDiffuse;

    uniform vec2 resolution;

    uniform float vignetteAmount;

    uniform float vignetteHardness;

    uniform float sharpness;

    varying vec2 vUv;


    void main() {

      vec2 texel =
        1.0 / resolution;


      vec3 center =
        texture2D(
          tDiffuse,
          vUv
        ).rgb;


      vec3 north =
        texture2D(
          tDiffuse,
          vUv + vec2(0.0, texel.y)
        ).rgb;


      vec3 south =
        texture2D(
          tDiffuse,
          vUv - vec2(0.0, texel.y)
        ).rgb;


      vec3 east =
        texture2D(
          tDiffuse,
          vUv + vec2(texel.x, 0.0)
        ).rgb;


      vec3 west =
        texture2D(
          tDiffuse,
          vUv - vec2(texel.x, 0.0)
        ).rgb;


      /*
        Mild unsharp mask.
      */

      vec3 blur =
        (
          north +
          south +
          east +
          west
        ) * 0.25;


      vec3 color =
        center +
        (
          center - blur
        ) *
        sharpness;


      /*
        Vignette
      */

      vec2 p =
        vUv - 0.5;


      float distanceFromCenter =
        length(
          p * vec2(1.0, 0.85)
        );


      float edge =
        smoothstep(

          0.25 +
          vignetteHardness * 0.15,

          0.78,

          distanceFromCenter

        );


      color *=
        1.0 -
        edge *
        vignetteAmount *
        0.55;


      gl_FragColor =
        vec4(
          color,
          1.0
        );

    }

  `

};


const finalPass =
  new ShaderPass(
    finalShader
  );


composer.addPass(
  finalPass
);


/* ==================================================
   TEXTURE LOADER
================================================== */

const textureLoader =
  new THREE.TextureLoader();


/* ==================================================
   GALAXY BACKGROUND

   Space_4.jpg

   IMPORTANT:
   Visible galaxy and PBR lighting are
   controlled separately.
================================================== */

let galaxySphere =
  null;


textureLoader.load(

  './Space_4.jpg',

  function(texture) {


    texture.colorSpace =
      THREE.SRGBColorSpace;


    const galaxyGeometry =
      new THREE.SphereGeometry(

        500,

        64,

        32

      );


    const galaxyMaterial =
      new THREE.ShaderMaterial({


        side:
          THREE.BackSide,


        depthWrite:
          false,


        depthTest:
          false,


        /*
          Prevent renderer tone mapping
          from crushing the background.
        */

        toneMapped:
          false,


        uniforms: {


          galaxyTexture: {

            value: texture

          },


          /*
            Visible galaxy brightness.

            Keep this separate from
            environmentIntensity.
          */

          brightness: {

            value: 1.0

          }

        },


        vertexShader: `

          varying vec2 vUv;


          void main() {

            vUv = uv;

            gl_Position =

              projectionMatrix *

              modelViewMatrix *

              vec4(
                position,
                1.0
              );

          }

        `,


        fragmentShader: `

          uniform sampler2D galaxyTexture;

          uniform float brightness;

          varying vec2 vUv;


          void main() {

            vec3 color =

              texture2D(
                galaxyTexture,
                vUv
              ).rgb;


            color *=
              brightness;


            gl_FragColor =

              vec4(
                color,
                1.0
              );

          }

        `

      });


    galaxySphere =
      new THREE.Mesh(

        galaxyGeometry,

        galaxyMaterial

      );


    galaxySphere.renderOrder =
      -1000;


    scene.add(
      galaxySphere
    );


    console.log(
      'Galaxy background loaded'
    );

  },


  undefined,


  function(error) {

    console.error(
      'Galaxy background error:',
      error
    );

  }

);


/* ==================================================
   ENVIRONMENT MAP
================================================== */

const pmremGenerator =
  new THREE.PMREMGenerator(
    renderer
  );


pmremGenerator
  .compileEquirectangularShader();


textureLoader.load(

  './Space_4.jpg',

  function(texture) {


    texture.mapping =
      THREE.EquirectangularReflectionMapping;


    texture.colorSpace =
      THREE.SRGBColorSpace;


    const envMap =

      pmremGenerator

        .fromEquirectangular(
          texture
        )

        .texture;


    scene.environment =
      envMap;


    /* ==============================================
       ENVIRONMENT LIGHTING

       Keep requested value:
       5
    ============================================== */

    scene.environmentIntensity =
      5;


    /* ==============================================
       SKETCHFAB ORIENTATION

       133.333°
    ============================================== */

    scene.environmentRotation.y =
      THREE.MathUtils.degToRad(
        133.333
      );


    console.log(
      'Environment loaded'
    );

  },


  undefined,


  function(error) {

    console.error(
      'Environment error:',
      error
    );

  }

);


/* ==================================================
   LIGHTS

   NONE

   Sketchfab's environment is doing the
   main work, so we still don't add
   artificial point/area lights here.
================================================== */


/* ==================================================
   MODEL
================================================== */

const loader =
  new GLTFLoader();


let mixer =
  null;


loader.load(

  './xuanzhuan.glb',


  function(gltf) {


    const model =
      gltf.scene;


    scene.add(
      model
    );


    /* ==============================================
       MATERIALS

       Sketchfab reference:

       Workflow       Metalness
       Base Color     dark red
       Metalness      0.67
       Specular F0    0.5
       Roughness      0

       Clear Coat     ON
       Intensity      1
       Reflectivity   0
       Roughness      0

       Emission       ON / black

       AO             OFF
       Normal/Bump    OFF
       SSS            OFF
       Sheen          OFF
       Opacity        OFF
    ============================================== */

    model.traverse(

      function(child) {


        if (
          !child.isMesh
        ) {

          return;

        }


        const materials =

          Array.isArray(
            child.material
          )

          ? child.material

          : [child.material];


        materials.forEach(

          function(material) {


            /* ======================================
               DOUBLE SIDED
            ====================================== */

            material.side =
              THREE.DoubleSide;


            /* ======================================
               METALNESS

               Sketchfab = 0.67
            ====================================== */

            if (
              'metalness'
              in material
            ) {

              material.metalness =
                0.67;

            }


            /* ======================================
               ROUGHNESS

               Sketchfab = 0

               Three.js gets too steel-like
               at literal zero, so use 0.06.

               This keeps the reflections sharp
               while Bloom provides softness.
            ====================================== */

            if (
              'roughness'
              in material
            ) {

              material.roughness =
                0.06;

            }


            /* ======================================
               ENVIRONMENT REFLECTION
            ====================================== */

            if (
              'envMapIntensity'
              in material
            ) {

              material.envMapIntensity =
                0.8;

            }


            /* ======================================
               NO GLASS
            ====================================== */

            if (
              'transmission'
              in material
            ) {

              material.transmission =
                0;

            }


            /* ======================================
               PHYSICAL MATERIAL
            ====================================== */

            if (
              material.isMeshPhysicalMaterial
            ) {


              /*
                Sketchfab:
                Clear Coat intensity = 1
              */

              material.clearcoat =
                1.0;


              /*
                Sketchfab:
                Clear Coat roughness = 0

                Tiny 0.03 compensation
                for Three.js.
              */

              material.clearcoatRoughness =
                0.03;


              /*
                Sketchfab Specular F0 = 0.5.

                Three's specularIntensity isn't
                exactly the same control, so don't
                force it down aggressively.
              */

              if (
                'specularIntensity'
                in material
              ) {

                material.specularIntensity =
                  1.0;

              }


              material.transmission =
                0;

            }


            /* ======================================
               EMISSION

               Screenshot shows emission ON
               but its color is black.

               That means effectively no visible
               self illumination.
            ====================================== */

            if (
              'emissive'
              in material
            ) {

              material.emissive.set(
                0x000000
              );


              material.emissiveIntensity =
                0;

            }


            material.needsUpdate =
              true;

          }

        );

      }

    );


    /* ==============================================
       MODEL BOUNDS
    ============================================== */

    const box =

      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =

      box.getSize(
        new THREE.Vector3()
      );


    const maxDim =

      Math.max(

        size.x,

        size.y,

        size.z

      );


    /* ==============================================
       LATEST CAMERA POSITION
    ============================================== */

    camera.position.set(

      12.846346542968408,

      -10.316274320587596,

      6.918512357944525

    );


    /* ==============================================
       LATEST CAMERA TARGET
    ============================================== */

    controls.target.set(

      -6.477044591147485,

      1.0907792606949331,

      4.834319124800277

    );


    /* ==============================================
       FOV
    ============================================== */

    camera.fov =
      45;


    camera.near =

      Math.max(

        maxDim * 0.0001,

        0.0001

      );


    camera.far =
      maxDim * 100;


    camera.updateProjectionMatrix();


    controls.update();


    /* ==============================================
       ANIMATION
    ============================================== */

    if (
      gltf.animations.length > 0
    ) {


      mixer =

        new THREE.AnimationMixer(
          model
        );


      const action =

        mixer.clipAction(
          gltf.animations[0]
        );


      action.setLoop(

        THREE.LoopRepeat,

        Infinity

      );


      /*
        IMPORTANT:
        keep animation at 0.1×
      */

      action.timeScale =
        0.1;


      action.clampWhenFinished =
        false;


      action.play();

    }


    console.log(
      'Model loaded successfully'
    );

  },


  function(xhr) {


    if (
      xhr.total
    ) {


      console.log(

        (
          xhr.loaded /
          xhr.total *
          100
        ).toFixed(0)

        + '% loaded'

      );

    }

  },


  function(error) {


    console.error(
      'GLB loading error:',
      error
    );

  }

);


/* ==================================================
   CAMERA DEBUG
   PRESS P
================================================== */

const cameraInfo =
  document.createElement(
    'div'
  );


cameraInfo.style.position =
  'fixed';


cameraInfo.style.top =
  '20px';


cameraInfo.style.left =
  '20px';


cameraInfo.style.zIndex =
  '9999';


cameraInfo.style.padding =
  '12px 16px';


cameraInfo.style.background =
  'rgba(0,0,0,0.82)';


cameraInfo.style.color =
  'white';


cameraInfo.style.fontFamily =
  'monospace';


cameraInfo.style.fontSize =
  '13px';


cameraInfo.style.lineHeight =
  '1.6';


cameraInfo.style.borderRadius =
  '6px';


cameraInfo.style.display =
  'none';


cameraInfo.style.pointerEvents =
  'none';


document.body.appendChild(
  cameraInfo
);


window.addEventListener(

  'keydown',

  function(event) {


    if (
      event.key.toLowerCase()
      === 'p'
    ) {


      const text =
`CAMERA POSITION:
${camera.position.x},
${camera.position.y},
${camera.position.z}

CAMERA TARGET:
${controls.target.x},
${controls.target.y},
${controls.target.z}

CAMERA FOV:
${camera.fov}`;


      cameraInfo.innerText =
        text;


      cameraInfo.style.display =
        'block';


      console.log(
        text
      );


      navigator.clipboard

        .writeText(
          text
        )

        .catch(
          () => {}
        );

    }

  }

);


/* ==================================================
   ANIMATION LOOP
================================================== */

const clock =
  new THREE.Clock();


function animate() {


  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if (
    mixer
  ) {

    mixer.update(
      delta
    );

  }


  /*
    Keep galaxy centered around camera.
  */

  if (
    galaxySphere
  ) {

    galaxySphere.position.copy(
      camera.position
    );

  }


  controls.update();


  /*
    IMPORTANT:
    Render composer instead of renderer
    so Bloom / Vignette / Sharpness work.
  */

  composer.render();

}


animate();


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

  'resize',

  function() {


    const width =
      window.innerWidth;


    const height =
      window.innerHeight;


    camera.aspect =
      width / height;


    camera.updateProjectionMatrix();


    renderer.setSize(
      width,
      height
    );


    composer.setSize(
      width,
      height
    );


    finalPass.uniforms
      .resolution
      .value
      .set(
        width,
        height
      );

  }

);


</script>

</body>

</html>
